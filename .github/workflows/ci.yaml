name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Run tests
        run: go test ./...

      - name: Build server
        run: go build ./cmd/server

      - name: Check domain layer dependencies
        run: go run ./scripts/check-deps.go

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fronted
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: fronted/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Build web
        run: pnpm --filter web build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Helm lint
        run: helm lint deployments/helm/sparkops

      - name: Helm template dry-run
        run: helm template sparkops deployments/helm/sparkops -f deployments/helm/sparkops/values-production.yaml > /dev/null

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f backend/deployments/docker/Dockerfile -t sparkops/api:ci backend

      - name: Build Web image
        run: docker build -f fronted/deployments/docker/Dockerfile -t sparkops/web:ci fronted
