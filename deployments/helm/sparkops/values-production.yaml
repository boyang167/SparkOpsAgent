# Production overrides — use with:
#   helm upgrade --install sparkops ./deployments/helm/sparkops \
#     -f deployments/helm/sparkops/values.yaml \
#     -f deployments/helm/sparkops/values-production.yaml \
#     --set secrets.jwtSecret=$JWT_SECRET \
#     --set-string secrets.databaseDsn=$DATABASE_DSN \
#     --set-string secrets.amqpUrl=$AMQP_URL

api:
  env:
    APP_ENV: production
    MESSAGING_DRIVER: amqp
    RUNTIME_DRIVER: k8s
    DELIVERY_DRIVER: jenkins
  amqp:
    eventExchange: sparkops.events
  outbox:
    pollInterval: 1s
    batchSize: 100
    lockTimeout: 1m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20

web:
  upstreamUrl: http://sparkops-api:8080
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 15

ingress:
  enabled: true
  hosts:
    - host: app.sparkops.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
    - host: api.sparkops.example.com
      paths:
        - path: /
          pathType: Prefix
          service: api

kubeconfig:
  enabled: true

# Enable only when the Prometheus Operator CRD is installed.
observability:
  messagingAlerts:
    enabled: false
