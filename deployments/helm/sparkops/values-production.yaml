# Production overrides — use with:
#   helm upgrade --install sparkops ./deployments/helm/sparkops \
#     -f deployments/helm/sparkops/values.yaml \
#     -f deployments/helm/sparkops/values-production.yaml \
#     --set secrets.jwtSecret=$JWT_SECRET \
#     --set secrets.databaseDsn=$DATABASE_DSN

api:
  env:
    APP_ENV: production
    MESSAGING_DRIVER: amqp
    RUNTIME_DRIVER: k8s
    DELIVERY_DRIVER: jenkins
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20

filesystem:
  enabled: true
  maxFileBytes: 21474836480
  providerSecretRefs: []
  networkPolicy:
    enabled: true

fileTransferGateway:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10

fileWorker:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20

sftpGateway:
  enabled: true
  replicaCount: 2

fileReconciler:
  replicaCount: 2

filesystemPdb:
  enabled: true
  minAvailable: 1

web:
  upstreamUrl: http://sparkops-api:8080
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 15

ingress:
  enabled: true
  hosts:
    - host: app.sparkops.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
    - host: api.sparkops.example.com
      paths:
        - path: /
          pathType: Prefix
          service: api

kubeconfig:
  enabled: true
