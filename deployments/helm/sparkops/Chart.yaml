apiVersion: v2
name: sparkops
description: SparkOps Agent platform (API + Web)
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - sparkops
  - devops
  - platform
maintainers:
  - name: SparkOps Team

dependencies:
  - name: postgresql
    version: 15.5.38
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: redis
    version: 20.6.2
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
  - name: rabbitmq
    version: 15.5.3
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: rabbitmq.enabled
