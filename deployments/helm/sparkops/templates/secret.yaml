apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sparkops.fullname" . }}-secrets
  labels:
    {{- include "sparkops.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_DSN: {{ .Values.secrets.databaseDsn | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  WEBHOOK_SECRET: {{ .Values.secrets.webhookSecret | quote }}
  JENKINS_TOKEN: {{ .Values.secrets.jenkinsToken | quote }}
  GITLAB_TOKEN: {{ .Values.secrets.gitlabToken | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  AMQP_URL: {{ .Values.api.amqp.url | quote }}
{{- if and .Values.kubeconfig.enabled .Values.kubeconfig.content }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sparkops.fullname" . }}-kubeconfig
  labels:
    {{- include "sparkops.labels" . | nindent 4 }}
type: Opaque
data:
  kubeconfig: {{ .Values.kubeconfig.content | b64enc | quote }}
{{- end }}
