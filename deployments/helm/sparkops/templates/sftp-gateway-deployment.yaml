{{- if and .Values.filesystem.enabled .Values.sftpGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sparkops.filesystem.fullname" (dict "root" . "component" "sftp-gateway") }}
  labels:
    {{- include "sparkops.labels" . | nindent 4 }}
    app.kubernetes.io/component: sftp-gateway
spec:
  replicas: {{ .Values.sftpGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "sparkops.filesystem.selectorLabels" (dict "root" . "component" "sftp-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sparkops.filesystem.selectorLabels" (dict "root" . "component" "sftp-gateway") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sparkops.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "sparkops.filesystem.selectorLabels" (dict "root" . "component" "sftp-gateway") | nindent 14 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sftp-gateway
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["/app/bin/sftp-gateway"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: sftp
              containerPort: 2022
          envFrom:
            - secretRef:
                name: {{ include "sparkops.filesystem.secretName" . }}
            {{- range .Values.filesystem.providerSecretRefs }}
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: sftp
          livenessProbe:
            tcpSocket:
              port: sftp
          resources:
            {{- toYaml .Values.sftpGateway.resources | nindent 12 }}
          volumeMounts:
            - name: landing-zone
              mountPath: /var/lib/sparkops/sftp
      volumes:
        - name: landing-zone
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
