{{- if and .Values.filesystem.enabled .Values.filesystem.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sparkops.fullname" . }}-filesystem-default-deny
  labels:
    {{- include "sparkops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - file-transfer-gateway
          - file-worker
          - sftp-gateway
          - file-reconciler
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sparkops.fullname" . }}-file-transfer-gateway
  labels:
    {{- include "sparkops.labels" . | nindent 4 }}
    app.kubernetes.io/component: file-transfer-gateway
spec:
  podSelector:
    matchLabels:
      {{- include "sparkops.filesystem.selectorLabels" (dict "root" . "component" "file-transfer-gateway") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "sparkops.api.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8082
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        {{- range .Values.filesystem.networkPolicy.dependencyPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sparkops.fullname" . }}-sftp-gateway
  labels:
    {{- include "sparkops.labels" . | nindent 4 }}
    app.kubernetes.io/component: sftp-gateway
spec:
  podSelector:
    matchLabels:
      {{- include "sparkops.filesystem.selectorLabels" (dict "root" . "component" "sftp-gateway") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.filesystem.networkPolicy.ingressNamespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 2022
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        {{- range .Values.filesystem.networkPolicy.dependencyPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sparkops.fullname" . }}-file-background-egress
  labels:
    {{- include "sparkops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - file-worker
          - file-reconciler
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        {{- range .Values.filesystem.networkPolicy.dependencyPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
        - protocol: UDP
          port: 53
{{- end }}
