{{- if .Values.migration.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sparkops.fullname" . }}-migration
  labels:
    {{- include "sparkops.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    # Keep the hook Secret until the next release: Helm executes this lower
    # weight hook before the Job, so deleting it on success would race the Job.
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseDsn | quote }}
{{- end }}
