global:
  imagePullSecrets: []

postgresql:
  enabled: false
  auth:
    username: sparkops
    password: sparkops
    database: sparkops

redis:
  enabled: false
  auth:
    enabled: false

rabbitmq:
  enabled: false
  auth:
    username: sparkops
    password: sparkops

nameOverride: ""
fullnameOverride: ""

api:
  replicaCount: 2
  image:
    repository: sparkops/api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  env:
    APP_ENV: production
    MESSAGING_DRIVER: amqp
    RUNTIME_DRIVER: k8s
    DELIVERY_DRIVER: jenkins
  # Non-sensitive connection defaults; override in values-production.yaml
  redis:
    addr: redis:6379
  amqp:
    url: amqp://sparkops:sparkops@rabbitmq:5672/
  jenkins:
    url: ""
    user: ""
  gitlab:
    baseUrl: ""
    projectPathPrefix: ""
  k8s:
    kubeconfigPath: /secrets/kubeconfig
    defaultCluster: ""
    clusters: []
  podSecurityContext: {}

web:
  replicaCount: 2
  image:
    repository: sparkops/web
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  upstreamUrl: ""  # auto: http://<release>-api:8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: app.sparkops.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
    - host: api.sparkops.example.com
      paths:
        - path: /
          pathType: Prefix
          service: api
  tls: []

observability:
  filesystemAlerts:
    enabled: true
    namespace: ""
    labels: {}
    for: 5m
    transferFailureRate: 0.05
    providerErrorsPerSecond: 1
    quotaReservationSeconds: 900
    reconcileBacklog: 1000
    outboxLagSeconds: 300
  messagingAlerts:
    enabled: true
    namespace: ""
    labels: {}
    for: 5m
    outboxOldestSeconds: 300
    operationOldestSeconds: 300
    pendingCount: 1000

secrets:
  # Set via --set or external secret manager in production
  databaseDsn: postgres://sparkops:changeme@postgres:5432/sparkops?sslmode=disable
  jwtSecret: replace-with-long-random-secret
  webhookSecret: replace-with-webhook-secret
  jenkinsToken: ""
  gitlabToken: ""
  openaiApiKey: ""

kubeconfig:
  enabled: false
  # Base64-encoded kubeconfig content when enabled
  content: ""

serviceAccount:
  create: true
  name: ""

nodeSelector: {}
tolerations: []
affinity: {}
