global:
  imagePullSecrets: []

postgresql:
  enabled: false
  auth:
    username: sparkops
    password: sparkops
    database: sparkops

redis:
  enabled: false
  auth:
    enabled: false

rabbitmq:
  enabled: false
  auth:
    username: sparkops
    password: sparkops

nameOverride: ""
fullnameOverride: ""

migration:
  # The pre-install/pre-upgrade hook uses the API image, which contains
  # /app/migrate-sql and /app/migrations.
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 600

api:
  replicaCount: 2
  image:
    repository: sparkops/api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  env:
    APP_ENV: production
    MESSAGING_DRIVER: amqp
    RUNTIME_DRIVER: k8s
    DELIVERY_DRIVER: jenkins
  # Non-sensitive connection defaults. The task queue exchange remains
  # "sparkops"; this is the separate transactional event topic exchange.
  redis:
    addr: redis:6379
  amqp:
    eventExchange: sparkops.events
  outbox:
    pollInterval: 1s
    batchSize: 100
    lockTimeout: 1m
    publishTimeout: 30s
  jenkins:
    url: ""
    user: ""
  gitlab:
    baseUrl: ""
    projectPathPrefix: ""
  k8s:
    kubeconfigPath: /secrets/kubeconfig
    defaultCluster: ""
    clusters: []
  podSecurityContext: {}

web:
  replicaCount: 2
  image:
    repository: sparkops/web
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  upstreamUrl: ""  # auto: http://<release>-api:8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: app.sparkops.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
    - host: api.sparkops.example.com
      paths:
        - path: /
          pathType: Prefix
          service: api
  tls: []

secrets:
  # Set via --set-string or an external secret manager in production.
  databaseDsn: postgres://sparkops:changeme@postgres:5432/sparkops?sslmode=disable
  amqpUrl: ""
  jwtSecret: replace-with-long-random-secret
  webhookSecret: replace-with-webhook-secret
  jenkinsToken: ""
  gitlabToken: ""
  openaiApiKey: ""

kubeconfig:
  enabled: false
  # Base64-encoded kubeconfig content when enabled
  content: ""

serviceAccount:
  create: true
  name: ""

observability:
  messagingAlerts:
    # Requires the Prometheus Operator monitoring.coreos.com/v1 CRD.
    enabled: false
    namespace: ""
    labels: {}
    outboxOldestSeconds: 60
    operationOldestSeconds: 300
    pendingCount: 100
    for: 10m

nodeSelector: {}
tolerations: []
affinity: {}
