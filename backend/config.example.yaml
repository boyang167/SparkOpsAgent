server:
  addr: ":8080"
database:
  # 方式一：结构化配置（推荐，密码可含 @/: 等特殊字符）
  # host: 192.168.5.24
  # port: 5432
  # user: admin
  # password: "admin@2025"
  # name: sparkops_agent
  # sslmode: disable
  # 方式二：完整 DSN（密码含特殊字符需 URL 编码，如 @ → %40）
  dsn: "postgres://sparkops:sparkops@localhost:5432/sparkops?sslmode=disable"
redis:
  addr: "localhost:6379"
messaging:
  # inmemory is synchronous and intended only for local development/tests.
  # Production must set MESSAGING_DRIVER=amqp and provide AMQP_URL as a secret.
  # The event exchange below is separate from the existing task queue exchange.
  driver: "inmemory"
  amqp:
    # Prefer the AMQP_URL environment variable; do not commit production credentials.
    url: "amqp://sparkops:sparkops@localhost:5672/"
    exchange: "sparkops" # Existing async task queue exchange.
    exchange_type: "direct"
    event_exchange: "sparkops.events" # Transactional domain-event topic exchange.
  outbox:
    poll_interval: 1s
    batch_size: 100
    lock_timeout: 1m
    publish_timeout: 30s
k8s:
  default_cluster: ""
  kubeconfig_path: ""
  clusters: []
runtime:
  driver: "k8s"
  cluster: ""
delivery:
  driver: "jenkins"
deploy:
  jenkins_timeout: 30m
  rollout_timeout: 10m
  reconcile_interval: 30s
jenkins:
  job_suffix: "-build"
gitlab:
  base_url: ""
  token: ""
  project_path_prefix: ""
webhook:
  secret: ""
jwt:
  secret: "change-me-in-production"
  expire_hour: 24
llm:
  default_provider: openai
  providers:
    openai:
      api_key: ""
      base_url: https://api.openai.com/v1
filesystem:
  reconciler:
    interval: 30s
    lease_ttl: 90s
    batch_size: 100
    gc_grace_period: 168h
  transfer_gateway:
    listen: ":8082"
    public_url: "http://localhost:8082"
    capability_audience: "sparkops-file-transfer"
    capability_secret: ""
    max_file_bytes: 21474836480
    storage_root: "./data/filesystem"
