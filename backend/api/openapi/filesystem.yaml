            maximum: 200
      responses:
        "200":
          description: Artifacts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ArtifactPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [filesystem]
      summary: Create an artifact link to a file
      operationId: createFilesystemArtifact
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArtifactRequest"
      responses:
        "201":
          description: Artifact created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Artifact"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/workspaces/{wsId}/exports:
    post:
      tags: [filesystem]
      summary: Start a controlled cross-organization export
      description: Creates an audited export task and a new file identity on import. It does not create a resource grant.
      operationId: startFilesystemExport
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartControlledExportRequest"
      responses:
        "201":
          description: Export task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExportTask"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/workspaces/{wsId}/exports/{exportId}/import:
    post:
      tags: [filesystem]
      summary: Import an exported file as a new file identity
      operationId: importExportedFilesystemFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ExportID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportExportedFileRequest"
      responses:
        "201":
          description: Imported file identity
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ImportedFile"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  parameters:
    OrganizationHeader:
      name: X-Organization-ID
      in: header
      required: true
      description: Organization context; membership is verified authoritatively.
      schema:
        type: string
        format: uuid
    WorkspaceHeader:
      name: X-Workspace-ID
      in: header
      required: false
      description: Optional current workspace context; membership and organization are verified authoritatively.
      schema:
        type: string
        format: uuid
    NamespaceID:
      name: namespaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceID:
      name: wsId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderID:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PoolID:
      name: poolId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NodeID:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrantID:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareRequestID:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CapabilityID:
      name: capabilityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportID:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionID:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionID:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ParentID:
      name: parent_id
      in: query
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        format: uuid
        maxLength: 128
    GovernanceCursor:
      name: cursor
      in: query
      description: Versioned, authenticated encrypted opaque continuation token bound to the caller and query context.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

  schemas:
    NamespaceSummary:
      type: object
      required: [id, namespace_type, organization_id, status, capabilities, entry_node_ids, entry_nodes_truncated]
      properties:
        id:
          type: string
          format: uuid
        namespace_type:
          type: string
          enum: [USER, WORKSPACE, ORGANIZATION]
        organization_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
          nullable: true
        owner_user_id:
          type: string
          format: uuid
          nullable: true
        root_node_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/ResourceAction"
        entry_node_ids:
          type: array
          description: Authorized subtree entry nodes; populated for partially visible organization namespaces.
          items:
            type: string
            format: uuid
        entry_nodes_truncated:
          type: boolean
    NamespaceSummaryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NamespaceSummary"
    ResourceAction:
      type: string
      enum: [READ, DOWNLOAD, WRITE, DELETE, SHARE, ADMIN]
    SharedNode:
      type: object
      required: [node, effective_actions, source_grant_ids, sources, original_path, source_namespace]
      properties:
        node:
          $ref: "#/components/schemas/Node"
        effective_actions:
          type: array
          items:
            $ref: "#/components/schemas/ResourceAction"
        source_grant_ids:
          type: array
          items:
            type: string
            format: uuid
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SharedGrantSource"
        original_path:
          type: string
        source_namespace:
          $ref: "#/components/schemas/SharedNamespaceSource"
    SharedGrantSource:
      type: object
      required: [grant_id, principal_type, principal_id, expires_at]
      properties:
        grant_id:
          type: string
          format: uuid
        principal_type:
          type: string
          enum: [USER, WORKSPACE, ORGANIZATION, ROLE, SERVICE_ACCOUNT, AGENT]
        principal_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
          nullable: true
    SharedNamespaceSource:
      type: object
      required: [namespace_type, owner_user_id]
      properties:
        namespace_type:
          type: string
          enum: [USER, WORKSPACE, ORGANIZATION]
        owner_user_id:
          type: string
          format: uuid
          nullable: true
    SharedNodePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SharedNode"
        next_cursor:
          type: string
    AuthorizationCacheKey:
      type: object
      required: [organization_id, workspace_id, actor_id, node_id, action, policy_version]
      properties:
        organization_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
          nullable: true
        actor_id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        action:
          $ref: "#/components/schemas/ResourceAction"
        policy_version:
          type: integer
          format: int64
    EffectiveAccess:
      type: object
      required: [decision, effective_actions, reason_code, source_grant_ids, policy_version, cache_key]
      properties:
        decision:
          type: string
          enum: [ALLOW, DENY]
        effective_actions:
          type: array
          items:
            $ref: "#/components/schemas/ResourceAction"
        reason_code:
          type: string
        source_grant_ids:
          type: array
          items:
            type: string
            format: uuid
        policy_version:
          type: integer
          format: int64
        cache_key:
          $ref: "#/components/schemas/AuthorizationCacheKey"
    Namespace:
      type: object
      required: [id, workspace_id, status]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        root_node_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
    Node:
      type: object
      required: [id, namespace_id, type, name, state, owner_id]
      properties:
        id:
          type: string
          format: uuid
        namespace_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum: [FILE, DIRECTORY]
        name:
          type: string
        current_revision_id:
          type: string
          format: uuid
          nullable: true
        state:
          type: string
          enum: [ACTIVE, TRASHED, RETENTION_HOLD, PURGE_PENDING, PURGED]
        owner_id:
          type: string
          format: uuid
    Revision:
      type: object
      required: [id, node_id, revision_no, size, mime_type, created_by]
      properties:
        id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        revision_no:
          type: integer
          minimum: 1
        size:
          type: integer
          format: int64
          minimum: 0
        mime_type:
          type: string
        created_by:
          type: string
          format: uuid
    NodePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        next_cursor:
          type: string
    RevisionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Revision"
        next_cursor:
          type: string
    CreateDirectoryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        namespace_id:
          type: string
          format: uuid
          description: If supplied, it must be the namespace owned by wsId.
        parent_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          minLength: 1
    RenameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    MoveOrCopyRequest:
      type: object
      additionalProperties: false
      properties:
        parent_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
    TransferStatus:
      type: string
      enum:
        - INITIATED
        - UPLOADING
        - PAUSED
        - VERIFYING
        - SCANNING
        - COMMITTING
        - COMPLETED
        - FAILED
        - REJECTED
        - ABORTED
        - EXPIRED
    TransferProtocol:
      type: string
      enum: [DIRECT, MULTIPART]
    TransferClassification:
      type: string
      enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]
    CreateTransferRequest:
      type: object
      additionalProperties: false
      required: [name, protocol, size, provider_id]
      properties:
        namespace_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          minLength: 1
        protocol:
          $ref: "#/components/schemas/TransferProtocol"
        size:
          type: integer
          minimum: 0
        sha256:
          type: string
        classification:
          $ref: "#/components/schemas/TransferClassification"
        provider_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    TransferPart:
      type: object
      required: [part_number, offset, size]
      properties:
        part_number:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        etag:
          type: string
        checksum:
          type: string
        upload_url:
          type: string
          format: uri
    Artifact:
      type: object
      required: [id, workspace_id, namespace_id, artifact_type, producer_type, producer_id, run_id, file_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        namespace_id:
          type: string
          format: uuid
        artifact_type:
          type: string
        producer_type:
          type: string
        producer_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        input_refs:
          type: array
          items:
            type: string
            format: uuid
        file_id:
          type: string
          format: uuid
        revision_id:
          type: string
          format: uuid
          nullable: true
        retention_policy_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
    CreateArtifactRequest:
      type: object
      required: [artifact_type, producer_type, producer_id, run_id, file_id]
      properties:
        artifact_type:
          type: string
        producer_type:
          type: string
        producer_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        input_refs:
          type: array
          items:
            type: string
            format: uuid
        file_id:
          type: string
          format: uuid
        retention_policy_id:
          type: string
          format: uuid
    ArtifactPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
        next_cursor:
          type: string
    TransferSession:
      type: object
      required:
        - session_id
        - workspace_id
        - namespace_id
        - target_name
        - status
        - protocol
        - expected_size
        - part_size
        - total_parts
        - expires_at
        - parts
      properties:
        session_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        namespace_id:
          type: string
          format: uuid
        target_parent_id:
          type: string
          format: uuid
          nullable: true
        target_name:
          type: string
        status:
          $ref: "#/components/schemas/TransferStatus"
        protocol:
          $ref: "#/components/schemas/TransferProtocol"
        expected_size:
          type: integer
        expected_sha256:
          type: string
        part_size:
          type: integer
        total_parts:
          type: integer
        expires_at:
          type: string
          format: date-time
        error_code:
          type: string
        upload_url:
          type: string
          format: uri
        capability_token:
          type: string
        parts:
          type: array
          items:
            $ref: "#/components/schemas/TransferPart"
    TransferSessionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TransferSession"
        next_cursor:
          type: string
    StorageProvider:
      type: object
      required: [id, organization_id, name, provider_type, secret_ref, status]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        provider_type:
          type: string
          enum: [LOCAL, NFS, S3]
        endpoint:
          type: string
        secret_ref:
          type: string
        capabilities:
          type: object
          additionalProperties: true
        config_version:
          type: integer
        status:
          type: string
    StorageProviderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StorageProvider"
    RegisterStorageProviderRequest:
      type: object
      required: [name, provider_type, secret_ref]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider_type:
          type: string
          enum: [LOCAL, NFS, S3]
        endpoint:
          type: string
        secret_ref:
          type: string
        capabilities:
          type: object
          additionalProperties: true
        status:
          type: string
    StorageProviderCreated:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    UpdateStorageProviderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        endpoint:
          type: string
        secret_ref:
          type: string
        status:
          type: string
    StorageProviderUpdated:
      type: object
      required: [updated]
      properties:
        updated:
          type: boolean
    StorageResourceDeleted:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
    StoragePoolMember:
      type: object
      required: [provider_id, mode, priority]
      properties:
        provider_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [PRIMARY, REPLICA, ARCHIVE, DRAINING]
        priority:
          type: integer
    StoragePool:
      type: object
      required: [id, name, status, placement_policy_version, members]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        placement_policy_version:
          type: integer
        members:
          type: array
          items:
            $ref: "#/components/schemas/StoragePoolMember"
    StoragePoolPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StoragePool"
    CreateStoragePoolRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/StoragePoolMember"
    UpdateStoragePoolRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        members:
          type: array
          items:
            $ref: "#/components/schemas/StoragePoolMember"
    StoragePoolCreated:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    StorageBinding:
      type: object
      required: [id, organization_id, scope_type, scope_id, pool_id, priority]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        scope_type:
          type: string
          enum: [ORGANIZATION, WORKSPACE, PROJECT, USER]
        scope_id:
          type: string
          format: uuid
        pool_id:
          type: string
          format: uuid
        priority:
          type: integer
    StorageBindingPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StorageBinding"
    CreateStorageBindingRequest:
      type: object
      required: [scope_type, scope_id, pool_id]
      properties:
        scope_type:
          type: string
          enum: [ORGANIZATION, WORKSPACE, PROJECT, USER]
        scope_id:
          type: string
          format: uuid
        pool_id:
          type: string
          format: uuid
        priority:
          type: integer
    StorageBindingCreated:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    LifecyclePolicy:
      type: object
      required: [id, organization_id, name, version, rules, status]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        rules:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    LifecyclePolicyPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LifecyclePolicy"
    UpsertLifecyclePolicyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        version:
          type: integer
        rules:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    LifecyclePolicyCreated:
      type: object
      required: [id, version]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
    FileAuditEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FileAuditEvent"
        next_cursor:
          type: string
    FileAuditEvent:
      type: object
      required:
        [id, actor_id, action, resource_type, resource_id, result, created_at, detail]
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        result:
          type: string
        trace_id:
          type: string
        created_at:
          type: string
          format: date-time
        detail:
          type: object
          additionalProperties: true
    SuccessEnvelope:
      type: object
      required: [code, message, trace_id]
      properties:
        code:
          type: integer
          enum: [0]
        message:
          type: string
        data: {}
        trace_id:
          type: string
    ResourceGrant:
      type: object
      required: [id, node_id, grantee_id, principal_type, principal_id, permission, effect]
      properties:
        id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        grantee_id:
          type: string
          format: uuid
        principal_type:
          type: string
          enum: [USER, WORKSPACE, ORGANIZATION, ROLE]
        principal_id:
          type: string
          format: uuid
        permission:
          type: string
          enum: [READ, DOWNLOAD, WRITE, DELETE, SHARE, ADMIN]
        effect:
          type: string
          enum: [ALLOW, DENY]
        expires_at:
          type: string
          format: date-time
          nullable: true
    ResourceGrantPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ResourceGrant"
    CreateResourceGrantRequest:
      type: object
      required: [grantee_id, permission, effect]
      properties:
        grantee_id:
          type: string
          format: uuid
        grantee_organization_id:
          type: string
          format: uuid
          description: Deprecated compatibility field; ignored for authorization.
        permission:
          type: string
          enum: [READ, DOWNLOAD, WRITE, DELETE, SHARE, ADMIN]
        effect:
          type: string
          enum: [ALLOW, DENY]
        expires_at:
          type: string
          format: date-time
          nullable: true
        anonymous:
          type: boolean
    CreateGovernedGrantRequest:
      oneOf:
        - $ref: "#/components/schemas/CreateTypedGrantRequest"
        - $ref: "#/components/schemas/CreateResourceGrantRequest"
    CreateTypedGrantRequest:
      type: object
      required: [principal_type, principal_ids, actions]
      properties:
        principal_type:
          type: string
          enum: [USER, WORKSPACE, ORGANIZATION, ROLE]
        principal_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        actions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [READ, DOWNLOAD, WRITE, DELETE, SHARE, ADMIN]
        effect:
          type: string
          enum: [ALLOW, DENY]
          default: ALLOW
        inherit_to_children:
          type: boolean
          default: true
        expires_at:
          type: string
          format: date-time
          nullable: true
    RejectShareRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ShareRequest:
      type: object
      required: [id, organization_id, namespace_id, node_id, requested_by, principal_type, principal_ids, actions, classification, effect, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        namespace_id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        requested_by:
          type: string
          format: uuid
        principal_type:
          type: string
          enum: [USER, WORKSPACE, ORGANIZATION, ROLE]
        principal_ids:
          type: array
          items:
            type: string
            format: uuid
        actions:
          type: array
          items:
            type: string
            enum: [READ, DOWNLOAD, WRITE, DELETE, SHARE, ADMIN]
        classification:
          type: string
          enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]
        effect:
          type: string
          enum: [ALLOW, DENY]
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, CANCELLED]
        created_at:
          type: string
          format: date-time
    IssueCapabilityRequest:
      type: object
      required: [run_id, resource_ids, run_resource_ids, actions, expires_at]
      properties:
        agent_id:
          type: string
          format: uuid
          nullable: true
        run_id:
          type: string
          format: uuid
        resource_ids:
          type: array
          items:
            type: string
            format: uuid
        run_resource_ids:
          type: array
          items:
            type: string
            format: uuid
        actions:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
    IssuedCapability:
      type: object
      required: [id, resource_ids, expires_at, replayed]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
        token_hash:
          type: string
        resource_ids:
          type: array
          items:
            type: string
            format: uuid
        expires_at:
          type: string
          format: date-time
        replayed:
          type: boolean
    StartControlledExportRequest:
      type: object
      required: [target_organization_id, target_workspace_id, source_node_id]
      properties:
        target_organization_id:
          type: string
          format: uuid
        target_workspace_id:
          type: string
          format: uuid
        source_node_id:
          type: string
          format: uuid
    ExportTask:
      type: object
      required: [id, source_organization_id, target_organization_id, source_node_id, classification, status]
      properties:
        id:
          type: string
          format: uuid
        source_organization_id:
          type: string
          format: uuid
        target_organization_id:
          type: string
          format: uuid
        source_workspace_id:
          type: string
          format: uuid
        target_workspace_id:
          type: string
          format: uuid
        source_node_id:
          type: string
          format: uuid
        target_node_id:
          type: string
          format: uuid
          nullable: true
        classification:
          type: string
          enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]
        status:
          type: string
          enum: [PENDING, IMPORTED]
    ImportExportedFileRequest:
      type: object
      required: [parent_id, name]
      properties:
        parent_id:
          type: string
          format: uuid
        name:
          type: string
    ImportedFile:
      type: object
      required: [node_id, source_node_id]
      properties:
        node_id:
          type: string
          format: uuid
        source_node_id:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      required: [code, message, data, trace_id]
      properties:
        code:
          type: integer
          enum: [1]
        message:
          type: string
        data:
          type: object
          required: [error_code]
          properties:
            error_code:
              type: string
              enum:
                - FILESYSTEM_INVALID_REQUEST
                - FILESYSTEM_IDEMPOTENCY_KEY_REQUIRED
                - FILESYSTEM_IDEMPOTENCY_KEY_INVALID
                - FILESYSTEM_UNSUPPORTED_MEDIA_TYPE
                - FILESYSTEM_NOT_FOUND
                - FILESYSTEM_RESOURCE_FORBIDDEN
                - FILESYSTEM_CROSS_ORGANIZATION_GRANT
                - FILESYSTEM_CROSS_WORKSPACE
                - FILESYSTEM_ANONYMOUS_LINK_DISABLED
                - FILESYSTEM_CAPABILITY_SCOPE_EMPTY
                - FILESYSTEM_CAPABILITY_REVOKED
                - FILESYSTEM_CAPABILITY_EXPIRED
                - FILESYSTEM_CAPABILITY_INVALID
                - FILESYSTEM_EXPORT_SCOPE
                - FILESYSTEM_CONFLICT
                - FILESYSTEM_QUOTA_EXCEEDED
                - FILESYSTEM_UNSUPPORTED_OPERATION
                - FILESYSTEM_OUTCOME_UNKNOWN
                - FILESYSTEM_RETRY_EXHAUSTED
                - FILESYSTEM_UNAVAILABLE
                - FILESYSTEM_INTERNAL_ERROR
                - FILESYSTEM_AUTHORIZATION_SCAN_BUDGET_EXCEEDED
                - AUTH_UNAUTHORIZED
                - AUTH_INVALID_TOKEN
                - AUTH_FORBIDDEN
                - TENANT_ORG_REQUIRED
                - TENANT_ORG_INVALID
                - TENANT_ORG_ACCESS_DENIED
                - TENANT_WORKSPACE_REQUIRED
                - TENANT_WORKSPACE_INVALID
                - TENANT_NOT_WORKSPACE_MEMBER
                - ENTITLEMENT_MODULE_DISABLED
                - INTERNAL_ERROR
        trace_id:
          type: string

  responses:
    NamespaceResponse:
      description: Workspace filesystem namespace
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Namespace"
    NodeCreated:
      description: Created
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Node"
    MutationOK:
      description: Mutation completed or already completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"
    TransferSessionCreated:
      description: Transfer session created
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TransferSession"
    TransferSessionResponse:
      description: Transfer session details
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TransferSession"
    InvalidRequest:
      description: Invalid request or idempotency key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: JSON mutation body has an unsupported media type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Membership, permission, or entitlement denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource is absent or belongs to another workspace
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Name, identity, root-mutation, command, or idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: Valid request cannot be applied to this filesystem resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected internal error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: Persistence, retry, or operation outcome is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

# File content upload and download bodies are served by the G2 Transfer Gateway; control-plane transfer routes manage sessions only.
