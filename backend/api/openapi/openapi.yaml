openapi: 3.0.3
info:
  title: SparkOps API
  version: 1.0.0
  description: SparkOps Greenfield MVP REST API

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: health
  - name: identity
  - name: tenant
  - name: governance
  - name: workspace_app
  - name: agent
  - name: workflow
  - name: knowledge
  - name: notification
  - name: integration
  - name: agent_runtime
  - name: delivery
  - name: runtime
  - name: filesystem

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./components.yaml#/components/schemas/Envelope"

  /api/v1/auth/register:
    $ref: "./identity.yaml#/paths/~1api~1v1~1auth~1register"
  /api/v1/auth/login:
    $ref: "./identity.yaml#/paths/~1api~1v1~1auth~1login"
  /api/v1/auth/me:
    $ref: "./identity.yaml#/paths/~1api~1v1~1auth~1me"
  /api/v1/auth/password:
    $ref: "./identity.yaml#/paths/~1api~1v1~1auth~1password"

  /api/v1/orgs:
    $ref: "./tenant.yaml#/paths/~1api~1v1~1orgs"
  /api/v1/orgs/{orgId}/workspaces:
    $ref: "./tenant.yaml#/paths/~1api~1v1~1orgs~1{orgId}~1workspaces"
  /api/v1/workspaces:
    $ref: "./tenant.yaml#/paths/~1api~1v1~1workspaces"

  /api/v1/workspaces/{wsId}/roles:
    $ref: "./governance.yaml#/paths/~1api~1v1~1workspaces~1{wsId}~1roles"
  /api/v1/workspaces/{wsId}/roles/{roleId}:
    $ref: "./governance.yaml#/paths/~1api~1v1~1workspaces~1{wsId}~1roles~1{roleId}"
