paths:
  /api/v1/auth/register:
    post:
      tags: [identity]
      summary: Register member
      operationId: registerMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                display_name:
                  type: string
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "./components.yaml#/components/schemas/Envelope"

  /api/v1/auth/login:
    post:
      tags: [identity]
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "./components.yaml#/components/schemas/Envelope"

  /api/v1/auth/me:
    get:
      tags: [identity]
      summary: Current member
      operationId: getCurrentMember
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./components.yaml#/components/schemas/Envelope"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
    patch:
      tags: [identity]
      summary: Update current member profile
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./components.yaml#/components/schemas/Envelope"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"

  /api/v1/auth/password:
    patch:
      tags: [identity]
      summary: Change password
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "./components.yaml#/components/schemas/Envelope"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
