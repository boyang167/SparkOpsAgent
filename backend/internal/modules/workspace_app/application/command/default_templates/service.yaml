apiVersion: v1
kind: Service
metadata:
  name: {{.service_name}}
  namespace: {{.namespace}}
  labels:
    app: {{.app_label}}
    app.kubernetes.io/name: {{.app_label}}
    app.kubernetes.io/managed-by: sparkops
spec:
  type: ClusterIP
  selector:
    app: {{.app_label}}
  ports:
{{- range .ports}}
  - name: {{.name}}
    port: {{.service_port}}
    targetPort: {{.container_port}}
    protocol: {{.protocol}}
{{- end}}
