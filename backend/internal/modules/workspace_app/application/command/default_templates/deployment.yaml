apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.deployment_name}}
  namespace: {{.namespace}}
  labels:
    app: {{.app_label}}
    app.kubernetes.io/name: {{.app_label}}
    app.kubernetes.io/part-of: {{.workspace_slug}}
    app.kubernetes.io/managed-by: sparkops
spec:
  replicas: {{.replicas}}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: {{.app_label}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{.app_label}}
        app.kubernetes.io/name: {{.app_label}}
    spec:
{{- if .image_pull_secret_name}}
      imagePullSecrets:
      - name: {{.image_pull_secret_name}}
{{- end}}
      terminationGracePeriodSeconds: 30
      containers:
      - name: {{.app_label}}
        image: {{.image}}
        imagePullPolicy: IfNotPresent
{{- if .command}}
        command:
{{- range .command}}
        - {{printf "%q" .}}
{{- end}}
{{- end}}
{{- if .args}}
        args:
{{- range .args}}
        - {{printf "%q" .}}
{{- end}}
{{- end}}
        envFrom:
        - configMapRef:
            name: {{.name}}-config
            optional: true
        ports:
{{- range .ports}}
        - name: {{.name}}
          containerPort: {{.container_port}}
          protocol: {{.protocol}}
{{- end}}
{{- range $i, $p := .ports}}{{if eq $i 0}}
        readinessProbe:
          tcpSocket:
            port: {{$p.container_port}}
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
{{- end}}{{end}}
        resources:
          requests:
            cpu: {{.resources.requests.cpu}}
            memory: {{.resources.requests.memory}}
          limits:
            cpu: {{.resources.limits.cpu}}
            memory: {{.resources.limits.memory}}
