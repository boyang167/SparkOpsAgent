apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{.name}}-vs
  namespace: {{.namespace}}
  labels:
    app: {{.app_label}}
    app.kubernetes.io/name: {{.app_label}}
    app.kubernetes.io/managed-by: sparkops
spec:
  hosts:
  - {{if .ingress_host}}{{.ingress_host}}{{else}}{{.name}}.{{.workspace_slug}}.example.com{{end}}
  gateways:
  - {{.name}}-gateway
  http:
  - route:
    - destination:
        host: {{.service_name}}.{{.namespace}}.svc.cluster.local
        port:
{{- range $i, $p := .ports}}{{if eq $i 0}}
          number: {{$p.service_port}}
{{- end}}{{end}}
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: gateway-error,connect-failure,refused-stream
