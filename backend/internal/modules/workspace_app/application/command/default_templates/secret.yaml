apiVersion: v1
kind: Secret
metadata:
  name: {{.name}}-secret
  namespace: {{.namespace}}
  labels:
    app: {{.app_label}}
    app.kubernetes.io/name: {{.app_label}}
    app.kubernetes.io/managed-by: sparkops
type: Opaque
stringData:
  # 在此填写敏感配置（如数据库密码、第三方密钥），请勿在模板中保存真实值
  APP_SECRET: "change-me"
