apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{.name}}-data
  namespace: {{.namespace}}
  labels:
    app: {{.app_label}}
    app.kubernetes.io/name: {{.app_label}}
    app.kubernetes.io/managed-by: sparkops
spec:
  accessModes:
  - ReadWriteOnce
{{- if .storage_class}}
  storageClassName: {{.storage_class}}
{{- end}}
  resources:
    requests:
      storage: {{if .storage_size}}{{.storage_size}}{{else}}10Gi{{end}}
