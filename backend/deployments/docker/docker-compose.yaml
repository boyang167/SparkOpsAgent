services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sparkops
      POSTGRES_PASSWORD: sparkops
      POSTGRES_DB: sparkops
    ports:
      - "5432:5432"
    volumes:
      - sparkops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparkops -d sparkops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: sparkops
      RABBITMQ_DEFAULT_PASS: sparkops
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  schema-bootstrap:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_DSN: postgres://sparkops:sparkops@postgres:5432/sparkops?sslmode=disable
    command: ["./migrate-schema"]
    restart: "no"

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      schema-bootstrap:
        condition: service_completed_successfully
    volumes:
      # The GORM bootstrap creates the historical baseline; this rollout applies
      # only the ordered transactional-event increment and records gate 75.
      - ../../migrations/000070_transactional_events.up.sql:/event-migrations/000070_transactional_events.up.sql:ro
      - ../../migrations/000070_transactional_events.down.sql:/event-migrations/000070_transactional_events.down.sql:ro
      - ../../migrations/000071_product_workflow_run_version.up.sql:/event-migrations/000071_product_workflow_run_version.up.sql:ro
      - ../../migrations/000071_product_workflow_run_version.down.sql:/event-migrations/000071_product_workflow_run_version.down.sql:ro
      - ../../migrations/000072_project_archive_generation.up.sql:/event-migrations/000072_project_archive_generation.up.sql:ro
      - ../../migrations/000072_project_archive_generation.down.sql:/event-migrations/000072_project_archive_generation.down.sql:ro
      - ../../migrations/000073_deployment_run_archive_generation.up.sql:/event-migrations/000073_deployment_run_archive_generation.up.sql:ro
      - ../../migrations/000073_deployment_run_archive_generation.down.sql:/event-migrations/000073_deployment_run_archive_generation.down.sql:ro
      - ../../migrations/000074_project_archive_phase.up.sql:/event-migrations/000074_project_archive_phase.up.sql:ro
      - ../../migrations/000074_project_archive_phase.down.sql:/event-migrations/000074_project_archive_phase.down.sql:ro
      - ../../migrations/000075_project_archive_intent.up.sql:/event-migrations/000075_project_archive_intent.up.sql:ro
      - ../../migrations/000075_project_archive_intent.down.sql:/event-migrations/000075_project_archive_intent.down.sql:ro
    command:
      - -path=/event-migrations
      - -database=postgres://sparkops:sparkops@postgres:5432/sparkops?sslmode=disable
      - up
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_DSN: postgres://sparkops:sparkops@postgres:5432/sparkops?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-min16}
      MESSAGING_DRIVER: ${MESSAGING_DRIVER:-amqp}
      AMQP_URL: amqp://sparkops:sparkops@rabbitmq:5672/
      AMQP_EVENT_EXCHANGE: ${AMQP_EVENT_EXCHANGE:-sparkops.events}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_LOCK_TIMEOUT: ${OUTBOX_LOCK_TIMEOUT:-1m}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RUNTIME_DRIVER: ${RUNTIME_DRIVER:-mock}
      DELIVERY_DRIVER: ${DELIVERY_DRIVER:-mock}
      JENKINS_URL: ${JENKINS_URL:-}
      JENKINS_USER: ${JENKINS_USER:-}
      JENKINS_TOKEN: ${JENKINS_TOKEN:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ../../../fronted
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      UPSTREAM_URL: http://api:8080
      NODE_ENV: production

volumes:
  sparkops_pg:
