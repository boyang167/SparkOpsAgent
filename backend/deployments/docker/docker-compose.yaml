services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sparkops
      POSTGRES_PASSWORD: sparkops
      POSTGRES_DB: sparkops
    ports:
      - "5432:5432"
    volumes:
      - sparkops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparkops -d sparkops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: sparkops
      RABBITMQ_DEFAULT_PASS: sparkops
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sparkops}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sparkops-local-minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sparkops_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.4
    ports:
      - "3310:3310"
    volumes:
      - sparkops_clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  migrate:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sparkops:sparkops@postgres:5432/sparkops?sslmode=disable
    command:
      - /bin/sh
      - -ec
      - >-
        DATABASE_DSN="$DATABASE_URL" ./migrate-schema -if-unversioned &&
        ./migrate-sql -path ./migrations -min-version 70
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_DSN: postgres://sparkops:sparkops@postgres:5432/sparkops?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-min16}
      MESSAGING_DRIVER: ${MESSAGING_DRIVER:-amqp}
      AMQP_URL: amqp://sparkops:sparkops@rabbitmq:5672/
      AMQP_EVENT_EXCHANGE: ${AMQP_EVENT_EXCHANGE:-sparkops.events}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_LOCK_TIMEOUT: ${OUTBOX_LOCK_TIMEOUT:-1m}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RUNTIME_DRIVER: ${RUNTIME_DRIVER:-mock}
      DELIVERY_DRIVER: ${DELIVERY_DRIVER:-mock}
      JENKINS_URL: ${JENKINS_URL:-}
      JENKINS_USER: ${JENKINS_USER:-}
      JENKINS_TOKEN: ${JENKINS_TOKEN:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  file-transfer-gateway:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    command: ["/app/bin/file-transfer-gateway"]
    ports:
      - "8082:8082"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      DATABASE_DSN: postgres://sparkops:sparkops@postgres:5432/sparkops?sslmode=disable
      REDIS_ADDR: redis:6379
      AMQP_URL: amqp://sparkops:sparkops@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-min16}
    volumes:
      - sparkops_filesystem:/var/lib/sparkops/filesystem

  file-worker:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    command: ["/app/bin/file-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      DATABASE_DSN: postgres://sparkops:sparkops@postgres:5432/sparkops?sslmode=disable
      REDIS_ADDR: redis:6379
      AMQP_URL: amqp://sparkops:sparkops@rabbitmq:5672/
    volumes:
      - sparkops_filesystem:/var/lib/sparkops/filesystem

  sftp-gateway:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    command: ["/app/bin/sftp-gateway"]
    ports:
      - "2022:2022"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      DATABASE_DSN: postgres://sparkops:sparkops@postgres:5432/sparkops?sslmode=disable
      REDIS_ADDR: redis:6379
      AMQP_URL: amqp://sparkops:sparkops@rabbitmq:5672/
      SPARKOPS_SFTP_HOST_KEY_PEM: ${SPARKOPS_SFTP_HOST_KEY_PEM:-}
    volumes:
      - sparkops_sftp:/var/lib/sparkops/sftp

  file-reconciler:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    command: ["/app/bin/file-reconciler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      DATABASE_DSN: postgres://sparkops:sparkops@postgres:5432/sparkops?sslmode=disable
      REDIS_ADDR: redis:6379
      AMQP_URL: amqp://sparkops:sparkops@rabbitmq:5672/
      FILESYSTEM_RECONCILER_INTERVAL: ${FILESYSTEM_RECONCILER_INTERVAL:-30s}
      FILESYSTEM_RECONCILER_LEASE_TTL: ${FILESYSTEM_RECONCILER_LEASE_TTL:-90s}
      FILESYSTEM_RECONCILER_BATCH_SIZE: ${FILESYSTEM_RECONCILER_BATCH_SIZE:-100}
      FILESYSTEM_RECONCILER_GC_GRACE_PERIOD: ${FILESYSTEM_RECONCILER_GC_GRACE_PERIOD:-168h}
    volumes:
      - sparkops_filesystem:/var/lib/sparkops/filesystem

  web:
    build:
      context: ../../../fronted
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      UPSTREAM_URL: http://api:8080
      NODE_ENV: production

volumes:
  sparkops_pg:
  sparkops_minio:
  sparkops_clamav:
  sparkops_filesystem:
  sparkops_sftp:
