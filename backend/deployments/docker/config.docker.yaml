server:
  addr: ":8080"
database:
  dsn: "postgres://sparkops:sparkops@postgres:5432/sparkops?sslmode=disable"
redis:
  addr: "redis:6379"
messaging:
  # Docker runs reliable events over AMQP. The task queue exchange and
  # transactional event exchange intentionally remain separate.
  driver: "amqp"
  amqp:
    # Override with the AMQP_URL secret outside local Docker Compose.
    url: "amqp://sparkops:sparkops@rabbitmq:5672/"
    exchange: "sparkops" # Existing async task queue exchange.
    exchange_type: "direct"
    event_exchange: "sparkops.events" # Transactional domain-event topic exchange.
  outbox:
    poll_interval: 1s
    batch_size: 100
    lock_timeout: 1m
    publish_timeout: 30s
runtime:
  driver: "k8s"
  cluster: ""
delivery:
  driver: "jenkins"
deploy:
  jenkins_timeout: 30m
  rollout_timeout: 10m
  reconcile_interval: 30s
jenkins:
  url: ""
  user: ""
  token: ""
  job_suffix: "-build"
gitlab:
  base_url: ""
  token: ""
  project_path_prefix: ""
webhook:
  secret: ""
jwt:
  secret: "docker-dev-secret-min16"
  expire_hour: 24
llm:
  default_provider: openai
  providers:
    openai:
      api_key: ""
      base_url: https://api.openai.com/v1
filesystem:
  transfer_gateway:
    listen: ":8082"
    public_url: "http://localhost:8082"
    capability_audience: "sparkops-file-transfer"
    capability_secret: "docker-dev-filesystem-secret"
    max_file_bytes: 21474836480
    storage_root: "/var/lib/sparkops/filesystem"
    control_base_url: "http://api:8080"
    internal_token: "docker-dev-filesystem-secret"
  reconciler:
    interval: 30s
    lease_ttl: 90s
    batch_size: 100
    gc_grace_period: 168h
  sftp:
    enabled: true
    listen: ":2022"
    host_key_secret_ref: ""
    landing_zone: "/var/lib/sparkops/sftp"
    idle_timeout: 15m
